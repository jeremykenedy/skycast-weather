<svg xmlns="http://www.w3.org/2000/svg" width="392" height="408"
viewBox="0 0 392 408" role="img" aria-labelledby="title description">
<title id="title">Skycast Weather</title>
<desc id="description">Live forecasts and a moving sky. No tracking or analytics.</desc>

<defs>
<linearGradient id="background" x2="1" y2="1">
<stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient>
<linearGradient id="sky" x2="0" y2="1">
<stop stop-color="#1e40af"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="cloud" x2="0" y2="1">
<stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
<clipPath id="scene"><rect width="188" height="136" rx="16"/></clipPath>
</defs>
<rect width="392" height="408" rx="16" fill="url(#background)"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="20" y="76" font-size="36"
font-weight="700" letter-spacing="-.5" fill="#fff">Skycast Weather</text>
<text x="20" y="104" font-size="12" fill="#a8a29e">
A forecast worth watching.</text>
<rect x="20" y="126" width="82" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-opacity=".35" stroke-width=".8"/><text x="61.0" y="140.5" fill="#60a5fa" font-size="8.5" font-weight="500" text-anchor="middle">Live weather</text><rect x="110" y="126" width="142" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-opacity=".35" stroke-width=".8"/><text x="181.0" y="140.5" fill="#4ade80" font-size="8.5" font-weight="500" text-anchor="middle">No tracking or analytics</text><rect x="260" y="126" width="84" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-opacity=".35" stroke-width=".8"/><text x="302.0" y="140.5" fill="#a78bfa" font-size="8.5" font-weight="500" text-anchor="middle">Moving sky</text>
</g>
<g transform="translate(55 184) scale(1.5)"><g clip-path="url(#scene)">
<rect width="188" height="136" fill="url(#sky)"/>
