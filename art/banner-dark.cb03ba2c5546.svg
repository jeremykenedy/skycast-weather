<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" aria-labelledby="title description" role="img" viewBox="0 0 800 200"><title id="title">Skycast Weather</title><desc id="description">Live forecasts and a moving sky. No tracking or analytics.</desc><style>@keyframes cloudTravel{0%{transform:translateX(-12px)}50%{transform:translateX(12px)}}@keyframes sunshine{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.07);opacity:1}}.far,.near,.sun,.wind{transform-box:fill-box;transform-origin:center}.near{animation:cloudTravel 6s ease-in-out infinite}.far{animation:cloudTravel 8.25s ease-in-out -2.25s infinite}.sun{animation:sunshine 3.75s ease-in-out infinite}.wind{animation:windFlow 3s linear infinite}@media (prefers-reduced-motion:reduce){.far,.near,.sun,.wind{animation:none}}</style><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1e40af"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient><clipPath id="scene"><rect width="188" height="136" rx="16"/></clipPath></defs><rect width="800" height="200" fill="url(#background)" rx="16"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="32" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Skycast Weather</text><text x="32" y="111" fill="#a8a29e" font-size="14">A forecast worth watching.</text><rect width="94" height="22" x="32" y="133" fill="#1a1a1a" stroke="#60a5fa" stroke-opacity=".35" stroke-width=".8" rx="11"/><text x="79" y="147.5" fill="#60a5fa" font-size="10" font-weight="500" text-anchor="middle">Live weather</text><rect width="164" height="22" x="134" y="133" fill="#1a1a1a" stroke="#4ade80" stroke-opacity=".35" stroke-width=".8" rx="11"/><text x="216" y="147.5" fill="#4ade80" font-size="10" font-weight="500" text-anchor="middle">No tracking or analytics</text><rect width="94" height="22" x="306" y="133" fill="#1a1a1a" stroke="#a78bfa" stroke-opacity=".35" stroke-width=".8" rx="11"/><text x="353" y="147.5" fill="#a78bfa" font-size="10" font-weight="500" text-anchor="middle">Moving sky</text></g><g><g clip-path="url(#scene)" transform="translate(574 32) scale(1)"><rect width="188" height="136" fill="url(#sky)"/><circle cx="139" cy="36" r="23" fill="#fbbf24" class="sun"/><g><g class="far"><path fill="#e2e8f0" d="M10 45C-5 45-6 20 10 18C14-5 47-6 54 17C77 9 92 44 68 45Z" opacity=".75" transform="translate(96 47) scale(.6)"/></g></g><g><g class="near"><path fill="url(#cloud)" d="M10 49C-7 49-6 23 11 21C13-4 49-9 58 17C83 6 106 48 78 49Z" transform="translate(27 43)"/></g></g><g fill="none" stroke="#dbeafe" stroke-dasharray="7 5" stroke-linecap="round" stroke-width="2" class="wind" opacity=".65"><path d="M18 108C63 94 116 115 170 102"/><path d="M30 122C74 109 124 130 175 117"/></g></g></g></svg>